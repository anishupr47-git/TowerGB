[build-system]
requires = ["setuptools>=68.0", "wheel>=0.41.0"]
build-backend = "setuptools.build_meta"

[project]
name = "towergb"
version = "0.1.0"
description = "TowerGB: A zero-heavy-dependency, high-performance, dual-tower calibrated ensemble meta-learner for tabular classification."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "TowerGB Contributors"},
]
keywords = [
    "machine-learning",
    "classification",
    "ensemble",
    "calibration",
    "tabular-data",
    "meta-learner",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

# ── Zero-heavy-dependency runtime ──────────────────────────────────────
dependencies = [
    "numpy>=1.22.0",
    "scikit-learn>=1.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pandas>=1.3.0",
]
benchmark = [
    "xgboost>=1.7.0",
    "pandas>=1.3.0",
]
dev = [
    "towergb[test,benchmark]",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/anishupr47-git/TableGB"
Repository = "https://github.com/anishupr47-git/TableGB"
Issues = "https://github.com/anishupr47-git/TableGB/issues"

# ── Setuptools src-layout discovery ────────────────────────────────────
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
towergb = ["py.typed"]

# ── Pytest configuration ──────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

# ── Mypy configuration ────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

# ── Ruff configuration ────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 88

